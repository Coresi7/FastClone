name: ci

# cmake-only-migration (design §6): PR/push build+test gate across three platforms.
# Fills the gap that deleting the VS solution left: the VS test-evidence gate is now
# reproduced by ctest, and every platform configures/builds/tests on each push/PR.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xxHash (static)
        # Build xxHash from source so the binaries are self-contained (no DLL to ship).
        shell: bash
        run: |
          git clone --depth 1 --branch v0.8.3 https://github.com/Cyan4973/xxHash.git /tmp/xxHash
          cmake -S /tmp/xxHash/cmake_unofficial -B /tmp/xxHash/build \
            -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=/tmp/xxHash-install
          cmake --build /tmp/xxHash/build --config Release --parallel
          cmake --install /tmp/xxHash/build --config Release
          echo "CMAKE_PREFIX_PATH=/tmp/xxHash-install" >> "$GITHUB_ENV"

      - name: Setup MSVC (x64, Windows only)
        # Same mechanism as the windows-arm64 job (L74-79): load the VS developer environment so
        # cl.exe / link.exe and the Windows SDK import libs are exported to the following steps.
        # Without it, git-bash's PATH makes CMake pick C:/mingw64/bin/c++.exe (GNU 15.2.0) while
        # Setup xxHash produced an MSVC xxhash.lib -> mixed toolchain + single-pass mingw ld,
        # which is exactly run 41008618624. No-op on Linux/macOS.
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure FastClone
        shell: bash
        # Windows must use the Ninja generator explicitly: the default generator
        # on windows-latest is Visual Studio 2026, under which ctest -N lists 0
        # tests (Testing/ metadata never generated) so CI can go green while
        # running nothing. Ninja is a single-config generator, so no -C flag.
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_COMPILER=cl \
              -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}"
          else
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}"
          fi

      - name: Assert MSVC toolchain (Windows only)
        # B-05 guard: prove the selected toolchain is MSVC and fail loud here, instead of
        # degrading into link-time "undefined reference" noise from a mingw fallback.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(build/CMakeFiles/*/CMakeCXXCompiler.cmake)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no build/CMakeFiles/*/CMakeCXXCompiler.cmake (configure did not run)"
            exit 1
          fi
          for f in "${files[@]}"; do
            if ! grep -q 'set(CMAKE_CXX_COMPILER_ID "MSVC")' "$f"; then
              echo "::error::expected MSVC on windows-latest, got: $(grep -m1 'set(CMAKE_CXX_COMPILER_ID' "$f") [$f]"
              exit 1
            fi
          done
          echo "MSVC toolchain confirmed: ${files[*]}"

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Test (ctest)
        shell: bash
        # Ninja is single-config; -C <cfg> is ignored/invalid there, so omit it.
        run: ctest --test-dir build --output-on-failure

  # Windows ARM64 cross-build (build-only). The x64-hosted runner cannot execute
  # ARM64 binaries, so this job intentionally has NO test step:
  # cross-compiled on x64 host; no test coverage by design.
  windows-arm64:
    name: windows-arm64 (build only)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC (amd64_arm64 cross env)
        # ilammy/msvc-dev-cmd configures the vs dev environment for the given
        # target arch and exports it into subsequent steps' PATH/INCLUDE/LIB.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Setup xxHash (static, ARM64)
        # Build an ARM64-targeted static xxHash from source so the FastClone ARM64
        # link has a matching-machine library. Installed to a separate prefix so
        # the x64 job's /tmp/xxHash-install is never touched.
        shell: cmd
        run: |
          git clone --depth 1 --branch v0.8.3 https://github.com/Cyan4973/xxHash.git C:\xxHash-src || exit /b 1
          cmake -S C:\xxHash-src\cmake_unofficial -B C:\xxHash-build-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=C:\xxHash-install-arm64 || exit /b 1
          cmake --build C:\xxHash-build-arm64 --parallel || exit /b 1
          cmake --install C:\xxHash-build-arm64 || exit /b 1
          echo CMAKE_PREFIX_PATH=C:\xxHash-install-arm64>> "%GITHUB_ENV%"

      - name: Configure FastClone (ARM64, Ninja)
        shell: cmd
        # The msvc-dev-cmd step already put the ARM64 cross compiler (Hostx64/arm64
        # cl.exe) on PATH; Ninja keeps the build single-config like the x64 job.
        run: cmake -S . -B build-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%CMAKE_PREFIX_PATH%" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded || exit /b 1

      - name: Build (ARM64, no test)
        shell: cmd
        run: cmake --build build-arm64 --parallel || exit /b 1

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastClone-windows-arm64
          path: |
            build-arm64/FastClone.exe
            build-arm64/FastCheck.exe

  # Linux sanitizer job (design §6): independent Debug + ASan/UBSan build.
  sanitizers:
    name: ${{ matrix.san }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        san: [address, undefined]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xxHash (static)
        shell: bash
        run: |
          git clone --depth 1 --branch v0.8.3 https://github.com/Cyan4973/xxHash.git /tmp/xxHash
          cmake -S /tmp/xxHash/cmake_unofficial -B /tmp/xxHash/build \
            -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=/tmp/xxHash-install
          cmake --build /tmp/xxHash/build --config Release --parallel
          cmake --install /tmp/xxHash/build --config Release
          echo "CMAKE_PREFIX_PATH=/tmp/xxHash-install" >> "$GITHUB_ENV"

      - name: Configure (Debug + ${{ matrix.san }})
        shell: bash
        run: |
          cmake -S . -B build-san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}" \
            -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.san }}" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.san }}"

      - name: Build
        shell: bash
        run: cmake --build build-san --parallel

      - name: Test (ctest)
        shell: bash
        # Ninja is single-config; -C <cfg> is ignored/invalid there, so omit it.
        run: ctest --test-dir build-san --output-on-failure
