name: release

# Produces a portable Windows x64 zip (FastClone.exe + FastCheck.exe) and publishes
# a GitHub Release. Triggered by pushing a `v*` tag (e.g. v1.0.0); the version string
# is derived from the tag (minus the leading `v`). For manual runs without a tag, the
# version falls back to `0.0.0-dev`.
#
# A drift guard asserts that the built version's MAJOR.MINOR aligns with the release tag
# (the PATCH field is auto-incremented at configure time and may legitimately differ), so
# the zip name, the git tag, and the binaries' `--version` output can never disagree on
# major/minor. FastClone/version.h remains the single source of truth consumed by the
# CMake build and this workflow.
#
# The release zip URL
# (https://github.com/Coresi7/FastClone/releases/download/v<x>/FastClone-<x>-x64.zip)
# and its SHA256 are the two values later consumed by the winget manifest.
#
# Build choices:
#  - Default Visual Studio generator (preinstalled on windows-latest; no vcvars needed).
#  - xxHash built as a STATIC library so the exes are self-contained (no DLL to ship).
#  - MSVC runtime locked to /MT (static CRT) so the zip has no VC++ redistributable dep.
#  - `cmake --install` to a staging prefix so artifact paths are generator-agnostic
#    (CMakeLists already has install(TARGETS FastClone / FastCheck)).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.0.0). Leave empty to read VERSION file.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.event.inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($v)) {
            if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
              $v = $Matches[1]
            } else {
              $v = '0.0.0-dev'
            }
          }
          $v = $v.TrimStart('v').Trim()
          Write-Host "Resolved version: $v"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify version.h major.minor matches release tag
        # Drift guard (cmake-auto-version, Q2=refined): the built kFastCloneVersion is
        # auto-incremented at configure time, so its PATCH field legitimately drifts from
        # the tag. We therefore assert semantic alignment instead of literal equality:
        #   - MAJOR.MINOR of the built version MUST equal MAJOR.MINOR of the release tag;
        #   - the PATCH field is allowed to differ (auto-incremented), but must still be a
        #     valid numeric level (>= the tag's patch, since builds only ever advance it).
        # This keeps the "forgot to bump major/minor before tagging" safety net while
        # tolerating automatic patch increments.
        shell: pwsh
        run: |
          $expected = '${{ steps.ver.outputs.version }}'
          $m = Select-String -Path FastClone/version.h -Pattern 'kFastCloneVersion\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $m) { Write-Error "kFastCloneVersion not found in FastClone/version.h"; exit 1 }
          $hv = $m.Matches.Groups[1].Value
          Write-Host "version.h=$hv  release=$expected"
          $hParts = $hv.Split('.')
          $eParts = $expected.Split('.')
          if ($hParts.Count -lt 3 -or $eParts.Count -lt 2) {
            Write-Error "Cannot parse version levels: version.h='$hv' release='$expected'"; exit 1
          }
          if ($hParts[0] -ne $eParts[0] -or $hParts[1] -ne $eParts[1]) {
            Write-Error "MAJOR.MINOR mismatch: version.h='$hv' vs release tag='$expected'. Bump FastClone/version.h major/minor to match the tag before tagging a release."
            exit 1
          }
          $hvPatch = [int]$hParts[2]
          $ePatch = [int]$eParts[1]
          if ($hvPatch -lt $ePatch) {
            Write-Error "Built patch ($hvPatch) is below the tag's patch base ($ePatch); the auto-increment must never move backwards. version.h='$hv' release='$expected'"
            exit 1
          }
          Write-Host "OK: major.minor aligned ($($hParts[0]).$($hParts[1])), built patch=$hvPatch >= tag patch base=$ePatch"

      - name: Build xxHash (static, /MT)
        shell: pwsh
        run: |
          git clone --depth 1 --branch 0.8.3 https://github.com/Cyan4973/xxHash.git C:\xxHash
          cmake -S C:\xxHash -B C:\xxHash\build `
            -DBUILD_SHARED_LIBS=OFF `
            -DXXH_BUILD_XXHSUM=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_INSTALL_PREFIX=C:\xxHash-install
          cmake --build C:\xxHash\build --config Release --parallel
          cmake --install C:\xxHash\build --config Release

      - name: Configure FastClone
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH=C:/xxHash-install `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Install to staging prefix
        shell: pwsh
        run: cmake --install build --config Release --prefix staging

      - name: Smoke test --version
        # Both exes must print "FastClone <ver>" / "FastCheck <ver>" and exit 0. The built
        # patch is auto-incremented, so we assert MAJOR.MINOR alignment with the tag (the
        # same semantic the drift guard uses), not a literal full-string equality.
        shell: pwsh
        run: |
          $expected = '${{ steps.ver.outputs.version }}'
          $eParts = $expected.Split('.')
          $fc = & staging/bin/FastClone.exe --version
          if ($LASTEXITCODE -ne 0) { Write-Error "FastClone --version exit $LASTEXITCODE"; exit 1 }
          $fck = & staging/bin/FastCheck.exe --version
          if ($LASTEXITCODE -ne 0) { Write-Error "FastCheck --version exit $LASTEXITCODE"; exit 1 }
          foreach ($pair in @(@("FastClone", $fc), @("FastCheck", $fck))) {
            $name = $pair[0]; $out = $pair[1]
            if ($out -notmatch '^(\S+) (\d+)\.(\d+)\.(\d+)$') { Write-Error "$name --version='$out' is not '<name> X.Y.Z'"; exit 1 }
            $bMaj = $Matches[2]; $bMin = $Matches[3]
            if ($bMaj -ne $eParts[0] -or $bMin -ne $eParts[1]) {
              Write-Error "$name --version='$out' major.minor ($bMaj.$bMin) != tag ($($eParts[0]).$($eParts[1]))"; exit 1
            }
          }
          # Both binaries must report the SAME fully-resolved version (single source of truth).
          $fcVer = ($fc -split ' ',2)[1]
          $fckVer = ($fck -split ' ',2)[1]
          if ($fcVer -ne $fckVer) { Write-Error "FastClone ($fcVer) and FastCheck ($fckVer) disagree"; exit 1 }
          Write-Host "$fc / $fck (major.minor aligned to tag $expected)"

      - name: Stage portable package
        id: pkg
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $stage = "stage/FastClone-$ver-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # Install layout puts both exes under staging/bin.
          Copy-Item staging/bin/FastClone.exe, staging/bin/FastCheck.exe -Destination $stage
          # Copy any runtime DLLs just in case (empty set when everything is statically linked).
          Copy-Item staging/bin/*.dll -Destination $stage -ErrorAction SilentlyContinue
          Copy-Item LICENSE, README.md, README_CN.md -Destination $stage
          $zip = "FastClone-$ver-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii sha256.txt
          Write-Host "SHA256: $hash"
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastClone-${{ steps.ver.outputs.version }}-x64
          path: |
            FastClone-${{ steps.ver.outputs.version }}-x64.zip
            sha256.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        # Only create a Release for tag pushes (bare workflow_dispatch runs just leave
        # the artifact above for inspection).
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FastClone-${{ steps.ver.outputs.version }}-x64.zip
            sha256.txt
          name: FastClone ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
