name: release

# Produces a portable Windows x64 zip (FastClone.exe + FastCheck.exe) and publishes
# a GitHub Release. Triggered by pushing a `v*` tag (e.g. v1.0.0); the version string
# is derived from the tag (minus the leading `v`). For manual runs without a tag, the
# version falls back to `0.0.0-dev`.
#
# A drift guard asserts that FastClone/version.h (the single source of truth consumed
# by both the VS solution and CMake) matches the release version, so the zip name, the
# git tag, and the binaries' `--version` output can never disagree.
#
# The release zip URL
# (https://github.com/Coresi7/FastClone/releases/download/v<x>/FastClone-<x>-x64.zip)
# and its SHA256 are the two values later consumed by the winget manifest.
#
# Build choices:
#  - Default Visual Studio generator (preinstalled on windows-latest; no vcvars needed).
#  - xxHash built as a STATIC library so the exes are self-contained (no DLL to ship).
#  - MSVC runtime locked to /MT (static CRT) so the zip has no VC++ redistributable dep.
#  - `cmake --install` to a staging prefix so artifact paths are generator-agnostic
#    (CMakeLists already has install(TARGETS FastClone / FastCheck)).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.0.0). Leave empty to read VERSION file.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.event.inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($v)) {
            if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
              $v = $Matches[1]
            } else {
              $v = '0.0.0-dev'
            }
          }
          $v = $v.TrimStart('v').Trim()
          Write-Host "Resolved version: $v"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify version.h matches release version
        # Drift guard: the committed kFastCloneVersion in FastClone/version.h must equal
        # the release version (from the git tag). Fails fast so a forgotten version.h
        # bump never ships a zip whose --version disagrees with its tag/zip name.
        shell: pwsh
        run: |
          $expected = '${{ steps.ver.outputs.version }}'
          $m = Select-String -Path FastClone/version.h -Pattern 'kFastCloneVersion\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $m) { Write-Error "kFastCloneVersion not found in FastClone/version.h"; exit 1 }
          $hv = $m.Matches.Groups[1].Value
          Write-Host "version.h=$hv  release=$expected"
          if ($hv -ne $expected) {
            Write-Error "version.h ($hv) != release version ($expected). Bump FastClone/version.h to match the tag."
            exit 1
          }

      - name: Build xxHash (static, /MT)
        shell: pwsh
        run: |
          git clone --depth 1 --branch 0.8.3 https://github.com/Cyan4973/xxHash.git C:\xxHash
          cmake -S C:\xxHash -B C:\xxHash\build `
            -DBUILD_SHARED_LIBS=OFF `
            -DXXH_BUILD_XXHSUM=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_INSTALL_PREFIX=C:\xxHash-install
          cmake --build C:\xxHash\build --config Release --parallel
          cmake --install C:\xxHash\build --config Release

      - name: Configure FastClone
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH=C:/xxHash-install `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Install to staging prefix
        shell: pwsh
        run: cmake --install build --config Release --prefix staging

      - name: Smoke test --version
        # Both exes must print "FastClone <ver>" / "FastCheck <ver>" and exit 0.
        shell: pwsh
        run: |
          $expected = '${{ steps.ver.outputs.version }}'
          $fc = & staging/bin/FastClone.exe --version
          if ($LASTEXITCODE -ne 0) { Write-Error "FastClone --version exit $LASTEXITCODE"; exit 1 }
          if ($fc -ne "FastClone $expected") { Write-Error "FastClone --version='$fc' != 'FastClone $expected'"; exit 1 }
          $fck = & staging/bin/FastCheck.exe --version
          if ($LASTEXITCODE -ne 0) { Write-Error "FastCheck --version exit $LASTEXITCODE"; exit 1 }
          if ($fck -ne "FastCheck $expected") { Write-Error "FastCheck --version='$fck' != 'FastCheck $expected'"; exit 1 }
          Write-Host "$fc / $fck"

      - name: Stage portable package
        id: pkg
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $stage = "stage/FastClone-$ver-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # Install layout puts both exes under staging/bin.
          Copy-Item staging/bin/FastClone.exe, staging/bin/FastCheck.exe -Destination $stage
          # Copy any runtime DLLs just in case (empty set when everything is statically linked).
          Copy-Item staging/bin/*.dll -Destination $stage -ErrorAction SilentlyContinue
          Copy-Item LICENSE, README.md, README_CN.md -Destination $stage
          $zip = "FastClone-$ver-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii sha256.txt
          Write-Host "SHA256: $hash"
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastClone-${{ steps.ver.outputs.version }}-x64
          path: |
            FastClone-${{ steps.ver.outputs.version }}-x64.zip
            sha256.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        # Only create a Release for tag pushes (bare workflow_dispatch runs just leave
        # the artifact above for inspection).
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FastClone-${{ steps.ver.outputs.version }}-x64.zip
            sha256.txt
          name: FastClone ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
